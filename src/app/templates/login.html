<!DOCTYPE html>
<html lang="id" data-coreui-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _t('Login') }} — CMT Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/coreui/css/coreui.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/theme.css?v={{ asset_ver }}" rel="stylesheet">
</head>
<body>
    <div class="d-flex align-items-center justify-content-center min-vh-100">
        <div class="card" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <div class="d-flex align-items-center mb-3">
                    <i class="bi bi-box-seam fs-3 me-2 text-primary"></i>
                    <div>
                        <h4 class="mb-0">{{ _t('Login') }}</h4>
                        <small class="text-body-secondary">CMT Dashboard</small>
                    </div>
                </div>
                {% if error %}
                    <div class="alert alert-danger py-2 small">{{ error }}</div>
                {% endif %}
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label class="form-label small">{{ _t('Username') }}</label>
                        <input class="form-control" name="username" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">{{ _t('Password') }}</label>
                        <input class="form-control" name="password" type="password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">{{ _t('Sign In') }}</button>
                </form>
                <p class="text-body-secondary small mt-3 mb-0">
                    {{ _t("Contact admin if you don't have an account.") }}
               </p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/coreui/js/coreui.bundle.min.js"></script>
    <!-- No custom layout.js needed on standalone login -->
</body>
</html>

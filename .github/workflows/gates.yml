name: gates

on:
  push:
    branches: [main, feat/**]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly: full run incl. real-DB audits (needs mounted data/*.db)

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, sqlite3, iconv

      - name: Install Python dependencies
        run: pip install -r src/requirements.txt

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: laravel

      # data/*.db is gitignored (regenerated by the FoxPro sync), so hosted CI
      # has no real company DBs: run_gates.py runs every gate that does not
      # need them and SKIPS the production audits with a warning. When real
      # schemas change, run `make gates` locally and commit any intentional
      # baseline/fixture diff together with the change.
      - name: Run gate set (production audits skipped without data/*.db)
        run: python tools/run_gates.py --fast

      # The real-DB audits are the one gate hosted CI cannot run (they need
      # the gitignored data/*.db). Run them nightly on a runner that mounts
      # the production DB copies, and always before a release cut.
      - name: Production audit (nightly, real DBs)
        if: github.event_name == 'schedule'
        run: python tools/run_gates.py

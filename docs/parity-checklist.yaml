        roles:
          - staff
      s2:
        step: search q hits REFSHITMEN, BLNO3, consignee/shipper names
        roles:
          - staff
      s3:
        step: sort combos (date|reference|customer x asc|desc) match on both apps
        roles:
          - staff
      s4:
        step: customer sees only own-company rows
        roles:
          - customer
      s5:
        step: pagination defaults and page-size selector match
        roles:
          - staff
  F-23:
    name: Projects / Jobs — Detail
    prd_row: F-23
    steps:
      s1:
        step: GET /projects-jobs/detail?ref=<known_ref> renders manifest, invoice lines, operational cost lines, DR/CN 
          FCL lines, DR/CN LCL lines
        roles:
          - staff
      s2:
        step: manifest section sources from MANIFEST (NOMOR, DATE, VESSEL, CONTAINERN, ETD_1, ETA_1) — second-layer 
          table
        roles:
          - staff
      s3:
        step: invoice lines from INVOICE_R grouped by K_INVOICE with SATUAN resolution
        roles:
          - staff
      s4:
        step: operational cost lines from OPRCOST_R grouped by UOPRCOST
        roles:
          - staff
      s5:
        step: DR/CN FCL lines from DRCRFULL_R where KD_SHIPLIN is set
        roles:
          - staff
      s6:
        step: DR/CN LCL lines from DRCRFULL_R where KD_SHIPLIN is not set
        roles:
          - staff
      s7:
        step: container/dimension lines from CARGO_R and NA_R (second-layer, small tables)
        roles:
          - staff
      s8:
        step: import cost lines from NA_D (second-layer, child of NA, not duplicate of OPRCOST_R)
        roles:
          - staff
      s9:
        step: customer role + foreign-company ref -> 303 back to /projects-jobs/summary
        roles:
          - customer
      s10:
        step: unknown ref -> 303 to /projects-jobs/summary (both apps)
        roles:
          - staff
  F-24:
    name: Account Receivables reports
    prd_row: F-24
    steps:
      s1:
        step: 'Aging A/R — Invoice: buckets from SAGING (AGING1..7 = 1,30,31,60,61,90,90), rows from INVOICE (BYR_USD, DIRPKAN,
          SELISIH_US, LUNAS, KB)'
        roles:
          - staff
      s2:
        step: 'Aging A/R — Debit Note: buckets from SAGING, rows from DRCRFULL/DRCRFULL_R (BAYAR, DIRPKAN, SELISIH, LUNAS)'
        roles:
          - staff
      s3:
        step: 'Contra Bond — In: AR_CONTRA/AR_CONTRA_R empty in all five companies — page renders zero rows with note'
        roles:
          - staff
      s4:

meta:
  id: cmt-laravel-parity
  title: Parity Checklist - CMT Dashboard Laravel Rebuild
  derived_from: PRD.md section 4 (feature parity inventory)
  source_of_truth: src/app/main.py + src/app/queries.py @ feat/system-hardening, 2026-09-22
  comparison_method: side-by-side, same SQLite DBs, per-role login
  schema_gates:
    - tests/parity/fixtures/real_schema.json = committed snapshot of the real data/*.db column sets 
      (tools/dump_real_schema.py); the sync owns these schemas (DBF field metadata), tests must never widen them
    - 'pytest tests/test_schema_gate.py: fixture-vs-DB fidelity, dataset ⊆ production shape, every query fn executes on production
      shape (runs in the plain suite)'
    - 'laravel/tests/Feature/ProductionSchemaTest.php: same gates for the PHP seed + query layer'
    - 'tools/audit_production_queries.py + laravel/tools/audit_production_queries.php: every query fn x every branch executed
      on COPIES of the real data/*.db, _safe_query un-swallowed (deeper than the default-args gates)'
    - 'python tools/run_gates.py (= make gates): one command running ALL of the above; --fast (= make gates-fast / hosted
      CI) skips the real-DB audits when data/ is absent'
    - 'origin: both apps'' invoice detail 500''d on production INVOICE (no CONTAINERN) while tests passed against a wider
      schema — see docs/decisions/invoice-container-schema-drift.md'
  roles:
    superadmin:
      level: 5
      note: full access incl. user delete + data-quality
    admin:
      level: 4
      note: user create/edit, no delete, no data-quality
    management:
      level: 3
      note: all data + sync trigger
    staff:
      level: 2
      note: view all data, no sync
    customer:
      level: 1
      note: seed CMT_USERS=customer:pw:customer:Trisco (customer_company=Trisco)
  data_preconditions:
    - All 5 company dirs synced via tools/sync_db.py; use CMT for comparisons
    - At least one shipment WITH invoices and one WITHOUT (detail + filter tests)
    - A customer-role user bound to company Trisco that owns at least one shipment
    - A shipment NOT linked to Trisco (negative test for cross-company access)
features:
  F-01:
    name: Login / logout / session cookie
    prd_row: F-01, F-01b
    steps:
      s1:
        step: GET /login returns 200 with the login form (both apps)
        roles:
          - anonymous
      s2:
        step: POST /login valid creds -> cookie (HttpOnly, SameSite=Lax, Secure iff secure-env) + 302 to /
        roles:
          - superadmin
      s3:
        step: POST /login bad creds -> login re-rendered with error, no session cookie set
        roles:
          - anonymous
      s4:
        step: POST /logout invalidates the server-side session; old cookie then redirects to /login
        roles:
          - staff
      s5:
        step: expired session (fast-forward expires_at) -> redirect to /login; session row cleaned up
        roles:
          - staff
        note: Laravel side = database session driver, 8h TTL
  F-02:
    name: Env-based user seeding (CMT_USERS)
    prd_row: F-02
    steps:
      s1:
        step: Boot with CMT_USERS=a:pw1:superadmin,b:pw2:staff,c:pw3:customer:Trisco -> all three log in
        roles:
          - superadmin
      s2:
        step: 'password hashes are salted and per-user (users table: identical passwords never share a hash)'
        roles:
          - superadmin
        expected_mismatch_note: hash FORMAT differs by design (PBKDF2 vs bcrypt) - compare salted-per-user property, not
          hash values
  F-03:
    name: User management UI
    prd_row: F-03
    steps:
      s1:
        step: GET /users renders the user list for admin+; 403 for management and below
        roles:
          - admin
          - management
      s2:
        step: POST /users/new creates a user; the new user can log in
        roles:
          - admin
      s3:
        step: POST /users/{id}/edit updates display_name/role/customer_company; empty password keeps current
        roles:
          - admin
      s4:
        step: POST /users/{id}/delete removes the user; admin gets 403 (superadmin-only); self-deletion blocked
        roles:
          - superadmin
          - admin
      s5:
        step: deleting a user invalidates their live sessions (or their next request fails)
        roles:
          - superadmin
        note: if the Python app has no session-kill, record as parity diff with note
  F-04:
    name: Dashboard (home)
    prd_row: F-04
    steps:
      s1:
        step: GET / summary card numbers are equal on both apps on the same DB
        roles:
          - staff
      s2:
        step: 'unpaid-shipments table: same rows, same order on both apps'
        roles:
          - staff
      s3:
        step: Top Customers panel hidden for customer role, present for staff+
        roles:
          - customer
          - staff
      s4:
        step: 'customer role sees only own-company rows in the unpaid table (KG-6 fixed 2026-09-22: the filtered dashboard
          renders normally)'
        roles:
          - customer
  F-05:
    name: Shipments list (unified, filters)
    prd_row: F-05
    steps:
      s1:
        step: 'GET /shipments default view: same rows, order, pagination on both apps'
        roles:
          - staff
      s2:
        step: type=import|export|other subsets match (TYPETRAN I / E / not-in-I,E)
        roles:
          - staff
      s3:
        step: invoice filter values unissued|issued|issued_unpaid|paid each match
        roles:
          - staff
      s4:
        step: q search hits REFSHITMEN, BLNO3, consignee/shipper names
        roles:
          - staff
      s5:
        step: customer sees only own-company shipments
        roles:
          - customer
      s6:
        step: sort combos (date|reference|customer x asc|desc) match on both apps
        roles:
          - staff
  F-05d:
    name: Shipment detail
    prd_row: F-06
    steps:
      s1:
        step: GET /shipments/detail?ref=<known_ref> renders header card + OPR costs + invoices + DN/CN notes
        roles:
          - staff
      s2:
        step: customer role + foreign-company ref -> 303 back to /shipments
        roles:
          - customer
        expected_mismatch_note: 'KNOWN GAP (IA doc section 5.1): the Python app has NO customer guard here - staff+ can open
          ANY shipment by ref. Reproduce defect-for-defect; the FR-005b fix is a post-cutover decision.'
      s3:
        step: unknown ref -> 303 to /shipments (both apps)
        roles:
          - staff
      s4:
        step: gross profit IDR conversion uses the per-document EXRATE (spot-check one shipment with non-1 EXRATE)
        roles:
          - staff
  F-06:
    name: Invoices list
    prd_row: F-07
    steps:
      s1:
        step: GET /invoices default view matches (rows, order, pagination)
        roles:
          - staff
      s2:
        step: q search hits NOINVOICE, REFSHITMEN, customer names
        roles:
          - staff
      s3:
        step: no status-filter control on /invoices in the Python app - parity means the same absence
        roles:
          - staff
        note: status filters live on /shipments as the invoice param (see KG-4); PRD F-07 wording was corrected 
          2026-09-22
      s4:
        step: customer sees only own-company invoices; a cross-company NOINVOICE search returns zero rows
        roles:
          - customer
  F-06d:
    name: Invoice detail
    prd_row: F-08
    steps:
      s1:
        step: 'GET /invoices/detail?k=<known_k> renders line items grouped by K_INVOICE + payment summary (KG-5 fixed 2026-09-22:
          query function implemented)'
        roles:
          - staff
      s2:
        step: unknown k -> 303 to /invoices (both apps)
        roles:
          - staff
      s3:
        step: customer role + invoice whose CUSTOMER does not contain their company -> 303 to /invoices (substring guard
          exists in Python)
        roles:
          - customer
      s4:
        step: corner totals convert USD at each document's own EXRATE
        roles:
          - staff
      s5:
        step: invoice detail returns 200 against a PRODUCTION-shaped INVOICE table (no CONTAINERN column); the Kontainer
          card renders '-'
        roles:
          - staff
        note: 'schema-gate regression (docs/decisions/invoice-container-schema-drift.md). Automated: pytest tests/test_schema_gate.py
          (production-shape execution of every query fn) + laravel ProductionSchemaTest. A query selecting a column the sync
          never creates must fail here, not only in production.'
  F-07:
    name: General Ledger list + detail
    prd_row: F-09
    note: NOT company-filtered by design (IA doc section 3 matrix) - every role sees the active DB's ledger
    steps:
      s1:
        step: GET /ledger matches (accounts list, type filter D/G, search, sort)
        roles:
          - staff
      s2:
        step: GET /ledger/detail?k=<acct> matches (JE_D rows, from/to date range, newest-first default)
        roles:
          - staff
      s3:
        step: pre-2000 corrupted journal dates render without crashing
        roles:
          - staff
  F-08:
    name: Sales Dashboard
    prd_row: F-10
    steps:
      s1:
        step: 'GET /sales default (p=all) matches: summary, trend, top customers, top salesman'
        roles:
          - staff
      s2:
        step: p=month|year|round|all each match
        roles:
          - staff
      s3:
        step: customer sees own-company numbers only
        roles:
          - customer
  F-09:
    name: Data Quality (superadmin)
    prd_row: F-11
    steps:
      s1:
        step: GET /data-quality -> 200 for superadmin; 403 for admin and below
        roles:
          - superadmin
          - admin
      s2:
        step: anomaly rollup counts match (unbalanced|orphan|bad_date|bad_dk) for the active company DB
        roles:
          - superadmin
      s3:
        step: GET /data-quality/detail?type=<X> matches for each type; type=bogus -> 303 back
        roles:
          - superadmin
  F-10:
    name: Company DB switcher
    prd_row: F-13
    steps:
      s1:
        step: POST /set-db with a valid company sets the cmt_db cookie; subsequent pages read that DB
        roles:
          - staff
      s2:
        step: POST /set-db with an invalid name falls back to the default DB
        roles:
          - staff
      s3:
        step: switcher is hidden when data/ contains at most one .db file
        roles:
          - staff
      s4:
        step: POST /set-db works without login (public endpoint - reproduce)
        roles:
          - anonymous
        expected_mismatch_note: 'KNOWN GAP (IA section 5.3): public POST; reproduce for parity (KG-3)'
  F-11:
    name: Sync trigger + sync-status API
    prd_row: F-14, F-17
    steps:
      s1:
        step: 'POST /sync -> 200 JSON {ok: true, ...} for management; 403 for staff'
        roles:
          - management
          - staff
      s2:
        step: POST /sync actually refreshes data (mtime of data/CMT.db advances; unified view rebuilt)
        roles:
          - management
        note: slow test (minutes) - run once per parity cycle, not per role
      s3:
        step: GET /api/sync-status returns last_sync + stale flag consistent with the DB mtime
        roles:
          - staff
  F-12:
    name: Health API
    prd_row: F-15
    steps:
      s1:
        step: GET /api/health is public, returns status ok, requires no auth
        roles:
          - anonymous
  F-13:
    name: Summary API
    prd_row: F-16
    steps:
      s1:
        step: GET /api/summary requires login (anonymous gets the login redirect / 403)
        roles:
          - anonymous
      s2:
        step: GET /api/summary JSON shape and values match for staff on the same DB
        roles:
          - staff
        expected_mismatch_note: 'KNOWN GAP (IA section 5.2): Python''s /api/summary is NOT company-filtered while GET / is.
          Reproduce for parity (KG-2); post-cutover fix is a PRD decision.'
  F-14:
    name: i18n (id / en / zh)
    prd_row: F-18
    steps:
      s1:
        step: POST /set-lang with id|en|zh sets the cmt_lang cookie and UI strings change
        roles:
          - anonymous
      s2:
        step: no untranslated keys on any compared page (spot-check sidebar + table headers in all 3 languages)
        roles:
          - staff
      s3:
        step: POST /set-lang works without login (public endpoint - reproduce)
        roles:
          - anonymous
        expected_mismatch_note: public POST by design (KG-3)
  F-15:
    name: Structured JSON logging
    prd_row: F-19
    steps:
      s1:
        step: request logs are JSON lines with method, path, status, duration_ms, user, request_id
        roles:
          - staff
      s2:
        step: auth events logged as user_login (ok/fail) and user_logout
        roles:
          - staff
  F-16:
    name: Custom 404
    prd_row: F-20
    steps:
      s1:
        step: GET /nonexistent renders the translated 404 page; logged-in chrome (sidebar) is preserved
        roles:
          - staff
  F-17:
    name: Read-only guarantee
    prd_row: F-21
    steps:
      s1:
        step: 'route audit: no POST/PUT/DELETE handler writes to business tables (only users/sessions); mirrored audit in
          the Laravel app'
        roles:
          - superadmin
  F-22:
    name: Projects / Jobs — Summary
    prd_row: F-22
    steps:
      s1:
        step: GET /projects-jobs/summary renders merged CARGO+NA header view with B/L status, invoice, operational cost,

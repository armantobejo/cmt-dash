known_gaps:
  - id: KG-1
    title: Shipment detail has no customer-role guard (invoice detail DOES)
    detail: 'GET /shipments/detail is login-gated but never checks customer_company, so a customer user can open another company''s
      shipment by guessing ref. /invoices/detail checks via substring match on the CUSTOMER header field and redirects 303
      to /invoices when it does not contain the user''s company. Parity: reproduce the asymmetry exactly; decide the FR-005b
      fix post-cutover.'
  - id: KG-2
    title: /api/summary is not company-filtered
    detail: 'Python /api/summary calls get_summary() with no company_filter while the GET / page filters the same query. Parity:
      reproduce; flag for post-cutover fix.'
  - id: KG-3
    title: /set-lang and /set-db are public POST endpoints
    detail: 'No login required (preference cookies only, low risk). Parity: reproduce.'
  - id: KG-4
    title: Invoice status filters live on /shipments, not /invoices
    detail: 'get_invoices() has no status filter; the unissued|issued|issued_unpaid|paid filter is a /shipments query param
      (invoice=). The changelog originally placed these on the invoices page. Parity: reproduce the placement exactly.'
  - id: KG-5
    title: (FIXED 2026-09-22) /invoices/detail used to return 500 (missing query function)
    detail: 'main.py:380 called q.get_invoice_detail() but queries.py never defined it (verified via AST scan 2026-09-22).
      Owner chose fix-in-Python: get_invoice_detail implemented (header joins shipment for voyage context; import/export customer
      branch; SATUAN-resolved line items via K_INVOICE). Baseline regenerated with the working page; the Laravel port targets
      the fixed behavior. Regression tests: tests/test_invoice_detail.py.'
  - id: KG-6
    title: (FIXED 2026-09-22) Customer-role dashboard used to return 500 (broken filtered SQL)
    detail: 'get_summary(company_filter=...) concatenated the company condition without a preceding '' AND '' separator ("WHERE
      u.DATE != ''''(UPPER(...") -> SQL syntax error for every customer-role user on the home page. Fixed by adding the separator
      to all three filtered count queries. Baseline regenerated with the working page. Regression tests: tests/test_invoice_detail.py.'
